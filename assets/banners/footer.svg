<svg
    width="1200"
    height="120"
    viewBox="0 0 1200 120"
    xmlns="http://www.w3.org/2000/svg"
>

    <!-- Background -->
    <rect
        width="1200"
        height="120"
        rx="18"
        fill="#0d1117"
    />

    <!-- Outer Border -->
    <rect
        x="2"
        y="2"
        width="1196"
        height="116"
        rx="16"
        fill="none"
        stroke="#30363d"
        stroke-width="3"
    />

    <!-- Main Card -->
    <rect
        x="110"
        y="22"
        width="980"
        height="76"
        rx="10"
        fill="#161b22"
        stroke="#8957e5"
        stroke-width="2"
    />

    <!-- Title -->
    <text
        x="260"
        y="70"
        fill="#a371f7"
        font-family="monospace"
        font-size="23"
        font-weight="bold"
    >
        TRAINERS VISITED ↓
    </text>

    <!-- Decorative divider -->
    <line
        x1="640"
        y1="40"
        x2="640"
        y2="80"
        stroke="#30363d"
        stroke-width="2"
    />

    <!-- Placeholder -->
    <text
        x="820"
        y="70"
        text-anchor="middle"
        fill="#8b949e"
        font-family="monospace"
        font-size="17"
    >
        Every trainer who has stopped by.
    </text>

</svg>